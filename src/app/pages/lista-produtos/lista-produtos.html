

<div class="mx-auto max-w-md p-4">

<div class="flex items-center gap-3">
      <button (click)="clickPaginaAnterior()" class="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 text-xl text-slate-600">
        ‹
      </button>
      <span class="text-sm font-medium text-slate-500">Barra De Pesquisa </span>
    </div>
  <!-- Topo: voltar pra busca -->


  <!-- O que foi buscado -->
  <div class="flex items-center gap-3 rounded-2xl bg-emerald-50 p-4">
    <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-emerald-100 text-emerald-700">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
    </div>
    <div class="min-w-0 flex-1">
      <p class="text-xs font-semibold uppercase text-slate-500">Resultados para</p>
      <p class="truncate text-lg font-bold text-slate-900">"{{ termoBuscado() }}"</p>
    </div>
    <span class="shrink-0 rounded-full bg-white px-3 py-1 text-sm text-slate-700">
      {{ produtos().length }} produtos
    </span>
  </div>

  <!-- Lista -->
  <div class="mt-4 flex flex-col gap-3">
    @for (produto of produtos(); track produto.id) {
      <div (click)="abrirLotes(produto.id)" class="flex cursor-pointer items-center gap-4 rounded-2xl border border-slate-200 bg-white p-3">
        @if (produto.fotoUrl) {
          <img [src]="produto.fotoUrl" [alt]="produto.nome" class="h-14 w-14 shrink-0 rounded-lg object-contain" />
        } @else {
          <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-lg bg-slate-50 text-2xl">📦</div>
        }
        <div class="min-w-0 flex-1">
          <p class="font-semibold text-slate-800">{{ produto.nome }}</p>
          <p class="text-sm text-slate-500">{{ produto.marcaDoProduto ?? 'Sem marca' }}</p>
        </div>
        <span class="text-2xl text-slate-400">›</span>
      </div>
    } @empty {
      <p class="mt-8 text-center text-slate-500">Nenhum produto encontrado.</p>
    }
  </div>

</div>
